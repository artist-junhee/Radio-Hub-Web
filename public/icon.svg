<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="primaryG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="waveG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Radio Hub Emblems: Stylized Broadcast Waves & Radio Core -->
  <g transform="translate(256, 256)">
    <!-- Outer Wave Ring -->
    <path d="M -130,-50 A 140,140 0 0,1 130,-50" fill="none" stroke="url(#waveG)" stroke-width="14" stroke-linecap="round" opacity="0.4"/>
    <path d="M -130,50 A 140,140 0 0,0 130,50" fill="none" stroke="url(#waveG)" stroke-width="14" stroke-linecap="round" opacity="0.4"/>

    <!-- Mid Wave Ring -->
    <path d="M -90,-35 A 98,98 0 0,1 90,-35" fill="none" stroke="url(#waveG)" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
    <path d="M -90,35 A 98,98 0 0,0 90,35" fill="none" stroke="url(#waveG)" stroke-width="16" stroke-linecap="round" opacity="0.75"/>

    <!-- Inner Wave Ring -->
    <path d="M -52,-20 A 56,56 0 0,1 52,-20" fill="none" stroke="url(#waveG)" stroke-width="16" stroke-linecap="round"/>
    <path d="M -52,20 A 56,56 0 0,0 52,20" fill="none" stroke="url(#waveG)" stroke-width="16" stroke-linecap="round"/>

    <!-- Central Glowing Core / Tower & Play Symbol -->
    <circle r="32" fill="url(#primaryG)" filter="url(#glow)"/>
    
    <!-- Stylized Modern Play Triangle -->
    <polygon points="-8,-16 16,0 -8,16" fill="#ffffff"/>
  </g>

  <!-- Bottom Frequency Accent Lines -->
  <g transform="translate(146, 420)">
    <rect x="0" y="0" width="8" height="24" rx="4" fill="#6366f1" opacity="0.8"/>
    <rect x="20" y="-8" width="8" height="40" rx="4" fill="#818cf8"/>
    <rect x="40" y="-18" width="8" height="60" rx="4" fill="#a855f7"/>
    <rect x="60" y="-12" width="8" height="48" rx="4" fill="#ec4899"/>
    <rect x="80" y="2" width="8" height="20" rx="4" fill="#818cf8" opacity="0.7"/>
    <rect x="100" y="-16" width="8" height="56" rx="4" fill="#38bdf8"/>
    <rect x="120" y="-24" width="8" height="72" rx="4" fill="#6366f1"/>
    <rect x="140" y="-14" width="8" height="52" rx="4" fill="#ec4899"/>
    <rect x="160" y="-6" width="8" height="36" rx="4" fill="#a855f7"/>
    <rect x="180" y="-20" width="8" height="64" rx="4" fill="#38bdf8"/>
    <rect x="200" y="0" width="8" height="24" rx="4" fill="#6366f1" opacity="0.8"/>
  </g>
</svg>
